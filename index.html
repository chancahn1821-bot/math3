</style></head><body><header><div class="header-inner"><div class="brand">Flatland Lab <span>차원을 넘어</span></div><div class="tag">기하 · 플랫랜드 활동지 연계</div></div></header><div class="study-clock" role="region" aria-label="활동 시간"><div class="study-clock-inner"><form id="clockEntry" class="clock-entry"><label for="studentName">이름</label><input id="studentName" name="studentName" type="text" placeholder="이름을 입력하세요" maxlength="30" required autocomplete="name"><button type="submit">학습 시작</button></form><span id="clockStudent" class="clock-student hidden"></span><div class="clock-main">⏱ 화면 표시 시간 <strong id="activeClock">00:00:00</strong></div><span class="clock-detail">시작 후 <span id="elapsedClock">00:00:00</span> · 이탈 <span id="awayCount">0</span>회</span><span class="clock-status" id="clockStatus" role="status">이름을 적고 학습 시작을 눌러 주세요</span></div></div><main><nav aria-label="탐구 단계"></nav><div class="kicker" id="kicker"></div><h1 id="title"></h1><p class="intro" id="intro"></p><div class="layout"><section class="panel" aria-label="조작 실험"><div class="scene"><div class="scenehead"><span id="sceneName"></span><span id="sceneBadge"></span></div><div class="canvases" id="canvases"><div class="view"><h2 id="viewA"></h2><canvas id="a" role="img"></canvas></div><div class="view" id="secondView"><h2 id="viewB"></h2><canvas id="b" role="img"></canvas></div></div><div class="scenefoot" id="sceneFoot"></div></div><div class="controls"><div class="choices" id="choices"></div><div id="sliders"></div><div class="buttons"><button id="play">자동 재생</button><button id="reset">실험 초기화</button></div><div class="metric" id="metrics"></div><p class="live" id="live" role="status"></p></div></section></div><div class="note" id="note"></div><details class="theory" id="theory"><summary>관찰한 뒤, 수학으로 확인하기</summary><div id="math"></div></details><div class="bottom"><div class="buttons"><button id="next" class="primary">다음 실험 →</button></div></div><footer>단면은 교집합, 투영은 다른 공간으로 보낸 그림입니다. 이 앱은 영화 장면을 재현하지 않는 수학 모형입니다.</footer></main><script>
'use strict';
const $=id=>document.getElementById(id),TAU=2*Math.PI;
const lessons=[
{nav:'세계와 차원',link:'활동지 1 · 영화 속 차원 세계 정리',title:'세계의 차원과 움직일 수 있는 방향',intro:'포인트랜드에서 스페이스랜드까지. 세계를 바꾸고 좌표를 움직이며, 새로 생기는 방향을 찾아보세요.',name:'각 세계 안에서 가능한 위치',badge:'좌표 0개 → 3개',a:'바깥에서 그린 세계의 지도',b:'',foot:'청록 점 = 위치 · 파랑 = 세계의 범위 · 화면은 외부 관찰자의 지도입니다.',note:'독립적인 좌표의 개수가 차원입니다. 선·평면 안에서의 이동과 그 공간 밖으로 나가는 이동을 구분하세요. 주민의 시각은 빛·가림 등 추가 모형에 따라 달라지므로, 이 그림 자체를 주민의 눈에 보이는 모습이라고 생각하지 않습니다.',math:'<p>0차원은 위치를 정할 좌표가 없는 한 점입니다. 1차원은 x, 2차원은 (x, y), 3차원은 (x, y, z)로 위치를 정합니다. 플랫랜드의 주민은 자기 평면에 수직인 z 방향으로 움직일 수 없습니다.</p><p>포인트랜드의 왕에 대한 영화의 인식 설정과, 좌표가 0개라는 수학적 정의는 구분합니다. 좌표의 개수만으로 생물의 감각을 모두 결정할 수는 없습니다.</p>'},
{nav:'차원 확장',link:'활동지 1 → 4 · 새로운 축으로 확장하기',title:'도형을 새로운 방향으로 쓸어 보세요',intro:'점, 선분, 정사각형을 선택한 다음 새 방향으로 움직여 보세요. 지나간 자리 전체가 어떤 도형이 되는지 관찰하세요.',name:'이동한 자취가 만드는 도형',badge:'한 방향을 더하다',a:'자취의 전체 모습',b:'',foot:'청록 = 움직인 도형 · 파랑 = 이동 전 도형 · 옅은 영역과 선 = 자취',note:'새로운 방향은 기존 도형이 놓인 공간 안의 방향이 아니라 그 공간에 수직인 방향입니다. 내부를 포함한 자취를 모으므로 선분 → 직사각형 → 직육면체가 만들어집니다. 이동량 1에서는 정사각형·정육면체입니다.',math:'<p>점 × 구간 = 선분, 선분 × 구간 = 직사각형, 정사각형 × 구간 = 직육면체입니다. 도형을 복제한 두 끝만 보는 것이 아니라 그 사이를 이동하며 지나간 모든 점을 모읍니다.</p><p>확장량이 0이면 원래 차원이고, 양수이면 차원이 하나 높아집니다. 길이가 모두 같아지는 마지막 순간에 정사각형·정육면체가 됩니다.</p>'},
{nav:'구의 단면',link:'활동지 2·3 · 구의 단면',title:'구를 자르는 높이와 원의 반지름',intro:'활동지처럼 구의 중심을 원점에 놓고 평면 z = k를 움직입니다. 오른쪽은 그 평면 안에 나타나는 단면입니다.',name:'구면 x² + y² + z² = r²',badge:'공간좌표로 단면 읽기',a:'구와 절단 평면 · 공간에서 보기',b:'절단 평면 안에서 보기',foot:'파랑 = 구면 · 옅은 평면 = z = k · 청록 = 구면과 평면의 교집합',note:'활동지의 등식은 내부가 아닌 구면을 나타냅니다. 따라서 오른쪽 단면은 원주를 그립니다. 내부를 포함한 구체를 자르면 원판입니다. 고정된 평면을 구가 통과하는 영화 장면과는 상대적 위치가 같은 실험입니다.',math:'<div class="formula">x² + y² + k² = r²<br>x² + y² = r² − k²<br>단면 반지름 ρ = √(r² − k²)</div><p>|k| &lt; r: 원 · |k| = r: 한 점 · |k| &gt; r: 교집합 없음. k와 −k에서 단면의 크기가 같습니다. k = 0에서 가장 큽니다.</p><p>영화에서는 구가 아직 평면에 닿기 전이거나, 완전히 지나간 뒤에 단면이 없습니다. 오른쪽은 평면의 지도이며 주민의 실제 망막상은 아닙니다.</p>'},
{nav:'원뿔과 곡선',link:'활동지 2 · 이차곡선',title:'기울기에 따라 달라지는 원뿔의 단면',intro:'꼭짓점을 지나지 않는 평면을 기울여 이중 원뿔을 자릅니다. 오른쪽에서 절단 평면 안의 곡선을 확인하세요.',name:'이중 원뿔 x² + y² = z²',badge:'원 → 타원 → 포물선 → 쌍곡선',a:'원뿔과 기울어진 평면',b:'절단 평면을 정면에서 보기',foot:'원뿔과 열린 곡선은 표시 범위만 그립니다. 잘린 화면 끝이 곡선의 끝은 아닙니다.',note:'쌍곡선을 보려면 위아래 두 부분이 있는 이중 원뿔이 필요합니다. 이 실험의 원뿔 모선은 수평면과 45°를 이루며, 절단 평면은 항상 (0, 0, 0.8)을 지나 꼭짓점을 피합니다. 모든 원뿔에서 임계각이 45°인 것은 아닙니다.',math:'<p>이 원뿔에서 수평면과 절단 평면이 이루는 각을 θ라고 하면 θ = 0°는 원, 0° &lt; θ &lt; 45°는 타원, θ = 45°는 포물선, 45° &lt; θ ≤ 80°는 쌍곡선입니다. 꼭짓점을 지나면 퇴화된 단면이 될 수 있어 여기서는 제외합니다.</p><div class="formula">(x, y, z) = (u cos θ, v, 0.8 + u sin θ)<br>cos(2θ)u² − 1.6 sin θ · u + v² − 0.64 = 0</div><p>u, v는 절단 평면 안의 서로 수직인 좌표입니다. 화면의 오른쪽 곡선은 이 좌표로 그린 실제 단면의 모양입니다. 공간에서 비스듬히 본 투영의 찌그러짐과 구분하세요.</p>'},
{nav:'4차원 체험',link:'활동지 4 · 4차원 확장',title:'새로운 방향을 볼 수 없어도 수학으로 다룰 수 있어요',intro:'초입방체를 회전하거나, 4차원 구의 3차원 단면을 관찰하세요. 좌표를 하나 더했을 때 나타나는 변화를 관찰하세요.',name:'좌표를 하나 더한 세계',badge:'(x, y, z, w)',a:'4차원에서 회전한 초입방체의 투영',b:'',foot:'초입방체: 청록·파랑은 두 정육면체, 밝은 선은 대응 꼭짓점을 연결한 모서리입니다.',note:'초입방체 그림은 단면이 아니라 4D → 3D → 화면의 투영입니다. 반면 ‘초구의 단면’ 모드에서는 4차원 구와 우리 3차원 공간의 교집합을 구합니다. 같은 화면에 그려져도 수학적 의미가 다릅니다.',math:'<p>초입방체의 꼭짓점은 (±1, ±1, ±1, ±1)의 16개입니다. 한 좌표만 다른 꼭짓점을 연결하면 모서리는 32개, 정사각형 면은 24개, 정육면체 세포는 8개입니다. 화면의 교차는 새 꼭짓점을 뜻하지 않습니다.</p><p>4차원 구의 내부까지 포함하여 x² + y² + z² + (w − h)² ≤ 1을 w = 0으로 자르면, 반지름 √(1 − h²)인 구체가 됩니다. |h| = 1이면 점, |h| &gt; 1이면 공집합입니다. 경계인 3-구면만 자르면 2-구면이 됩니다.</p>'},
{nav:'곡률과 삼각형',link:'비유클리드기하 · 공간의 곡률 읽기',title:'공간이 휘면 삼각형의 각의 합도 달라져요',intro:'평면·구면·쌍곡면을 바꾸고 삼각형의 크기와 곡률을 조절해 보세요. 같은 “직선”도 공간에 따라 달라지고, 내각의 합은 공간의 휘어짐을 드러냅니다.',name:'유클리드 · 구면 · 쌍곡기하',badge:'곡률 K와 내각의 합',a:'공간 위의 측지삼각형',b:'',foot:'삼각형의 변은 각 공간에서 가장 곧은 길인 측지선입니다. 화면은 공간의 구조를 비교하기 위한 모형입니다.',note:'작은 영역에서는 구면과 쌍곡면도 거의 평평해 보여 각의 합이 180°에 가까워집니다. 삼각형이 커지거나 곡률의 절댓값이 커질수록 차이가 뚜렷해집니다. 우리가 유클리드기하를 먼저 배우는 까닭은 일상 규모의 공간을 매우 정확하고 간단하게 설명하며, 거리·각·넓이·좌표를 다루는 수학의 공통 언어가 되기 때문입니다.',math:'<p><b>곡률 K</b>는 공간이 휘어진 정도와 방향을 나타냅니다. 평면은 K = 0, 구면은 K &gt; 0, 쌍곡면은 K &lt; 0입니다.</p><div class="formula">A + B + C − π = K · S</div><p>곡률이 일정한 공간에서 S는 측지삼각형의 넓이입니다. K &gt; 0이면 각의 합이 180°보다 크고, K = 0이면 정확히 180°, K &lt; 0이면 180°보다 작습니다. 따라서 각의 초과량 또는 결손량은 곡률과 삼각형의 넓이가 함께 결정합니다.</p><p><b>그렇다면 왜 유클리드기하를 배울까요?</b> 교실·건축물·도면처럼 지구의 곡률에 비해 작은 범위에서는 공간을 평면으로 보아도 오차가 거의 없습니다. 또한 유클리드기하는 좌표기하, 벡터, 미적분과 공학의 출발점입니다. 비유클리드기하는 이를 틀렸다고 바꾸는 이론이 아니라, 더 큰 규모와 휘어진 공간으로 확장하는 이론입니다.</p>'}
];
let stage=0,world=0,expansion=1,mode4=0,geometry=0,playing=false,animLast=0,animValue=0;
let values={x:.5,y:.3,z:.2,sweep:0,r:1.5,k:0,theta:0,angle:25,view:25,h:0,side:.8,curve:.55};
function stop(){playing=false;$('play').textContent='자동 재생'}
function range(id,label,min,max,step,val,ends){const d=document.createElement('div');d.className='control';d.innerHTML=`<div class="labelrow"><label for="s-${id}">${label}</label><output id="o-${id}"></output></div><input id="s-${id}" type="range" min="${min}" max="${max}" step="${step}" value="${val}"><div class="ends"><span>${ends[0]}</span><span>${ends[1]}</span></div>`;$('sliders').append(d);$('s-'+id).oninput=e=>{stop();values[id]=Number(e.target.value);update()}}
function choice(label,active,fn){const b=document.createElement('button');b.textContent=label;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));b.onclick=()=>{stop();fn()};$('choices').append(b)}
function go(n){stop();stage=n;if(n===1)values.sweep=0;const l=lessons[n];$('kicker').textContent=l.link;$('title').textContent=l.title;$('intro').textContent=l.intro;$('sceneName').textContent=l.name;$('sceneBadge').textContent=l.badge;$('viewA').textContent=l.a;$('viewB').textContent=l.b;$('sceneFoot').textContent=l.foot;$('note').textContent=l.note;$('math').innerHTML=l.math;$('theory').open=false;$('secondView').classList.toggle('hidden',![2,3].includes(n));$('canvases').classList.toggle('single',![2,3].includes(n));document.querySelectorAll('nav button').forEach(b=>{const on=Number(b.dataset.stage)===n;b.classList.toggle('active',on);if(on)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')});$('next').textContent=n===4?'처음 실험으로 ↺':'다음 실험 →';$('live').textContent='';buildControls();resize()}
function buildControls(){
  stop();$('choices').innerHTML='';$('sliders').innerHTML='';
  if(stage===0){
    ['0D · 점','1D · 선','2D · 평면','3D · 공간'].forEach((s,i)=>choice(s,world===i,()=>{world=i;buildControls()}));
    ['x','y','z'].slice(0,world).forEach(id=>range(id,id+' 좌표',-1,1,.01,values[id],['−1','1']));
    $('play').classList.toggle('hidden',world===0)
  }else if(stage===1){
    [1,2,3].forEach(i=>choice(`${i-1}D → ${i}D`,expansion===i,()=>{expansion=i;values.sweep=0;buildControls()}));
    range('sweep','새로운 방향으로 이동',0,1,.01,values.sweep,['0 · 이동 전','1 · 확장 완료'])
  }else if(stage===2){
    range('r','구의 반지름 r',.5,2,.1,values.r,['0.5','2']);
    range('k','절단 높이 k',-2.5,2.5,.01,values.k,['−2.5','2.5']);
    [['아래 접점 −r',()=>-values.r],['중심 0',()=>0],['위 접점 +r',()=>values.r],['바깥으로',()=>values.r+.2]].forEach(([s,f])=>choice(s,false,()=>{values.k=f();$('s-k').value=values.k;update()}))
  }else if(stage===3){
    [0,30,45,60,80].forEach(v=>choice(v+'°',values.theta===v,()=>{values.theta=v;$('s-theta').value=v;update()}));
    range('theta','수평면과 이루는 각 θ',0,80,.5,values.theta,['0° · 수평','80° · 크게 기울임'])
  }else if(stage===4){
    choice('초입방체 · 투영',mode4===0,()=>{mode4=0;buildControls()});
    choice('초구 · 단면',mode4===1,()=>{mode4=1;buildControls()});
    if(!mode4){
      range('angle','4차원 xw 회전각',-180,180,1,values.angle,['−180°','180°']);
      range('view','그림의 관찰 방향',-180,180,1,values.view,['−180°','180°'])
    }else range('h','네 번째 방향의 중심 위치 h',-1.2,1.2,.01,values.h,['−1.2','1.2']);
    $('viewA').textContent=mode4?'우리 3차원 공간에 나타나는 구체의 단면':'4차원에서 회전한 초입방체의 투영';
    $('sceneFoot').textContent=mode4?'구체는 3차원 단면입니다. 화면에서는 그 구체를 다시 투영해 보여줍니다.':lessons[4].foot
  }else{
    ['유클리드 · K = 0','구면 · K > 0','쌍곡 · K < 0'].forEach((s,i)=>choice(s,geometry===i,()=>{geometry=i;buildControls()}));
    range('side','삼각형 한 변의 길이 s',.3,1.4,.01,values.side,['작은 삼각형','큰 삼각형']);
    if(geometry!==0)range('curve','곡률의 크기 |K|',.1,1,.01,values.curve,['거의 평평함','강하게 휘어짐']);
    $('viewA').textContent=['평면 위의 직선 삼각형','구면 위의 대원호 삼각형','안장형 곡면 위의 삼각형'][geometry];
    $('sceneFoot').textContent=geometry===2?'안장형 곡면은 음의 곡률을 눈으로 이해하기 위한 모형입니다. 표시 수치는 곡률이 일정한 쌍곡평면의 측지삼각형을 나타냅니다.':geometry===1?'곡률 K가 커지면 구의 반지름 R이 작아집니다. 삼각형 한 변의 길이 s는 같은 화면 척도로 유지됩니다.':'청록색 변은 공간에서 가장 곧은 길인 측지선입니다. 꼭짓점의 각과 전체 각의 합을 비교하세요.'
  }
  if(stage!==0)$('play').classList.remove('hidden');update()
}
function radius(r,k){return Math.abs(k)>r?null:Math.sqrt(Math.max(0,r*r-k*k))}
function conicKind(deg){return deg===0?'원':deg<45?'타원':deg===45?'포물선':'쌍곡선'}
function metric(k,v){return `<div><small>${k}</small><strong>${v}</strong></div>`}
function triangleData(){
  const K=geometry===0?0:(geometry===1?values.curve:-values.curve);
  if(K===0)return{K,alpha:Math.PI/3,sum:Math.PI,delta:0,area:Math.sqrt(3)*values.side*values.side/4,x:0};
  const x=values.side*Math.sqrt(Math.abs(K));
  const alpha=K>0?Math.acos(Math.cos(x)/(1+Math.cos(x))):Math.acos(Math.cosh(x)/(1+Math.cosh(x)));
  const sum=3*alpha,delta=sum-Math.PI;
  return{K,alpha,sum,delta,area:delta/K,x}
}
function update(){
  for(const [id,v]of Object.entries(values)){const o=$('o-'+id);if(o)o.textContent=['angle','view','theta'].includes(id)?v.toFixed(id==='theta'?1:0)+'°':v.toFixed(2)}
  let s='';
  if(stage===0){s=metric('세계',['포인트랜드','라인랜드','플랫랜드','스페이스랜드'][world])+metric('독립 좌표',world+'개')+metric('현재 위치',world?'('+['x','y','z'].slice(0,world).map(k=>values[k].toFixed(2)).join(', ')+')':'한 점');$('sceneBadge').textContent=world+'차원';$('live').textContent=['이 세계 안에는 움직일 방향이 없습니다.','앞뒤로 움직일 수 있지만, 선 밖으로 비켜설 수는 없습니다.','평면 안의 두 독립 방향으로 이동합니다. 평면 밖은 새 차원입니다.','세 독립 방향으로 이동합니다. 네 번째 방향은 이 공간의 방향이 아닙니다.'][world]}
  if(stage===1)s=metric('확장',`${expansion-1}D → ${expansion}D`)+metric('현재 도형',values.sweep===0?['점','선분','정사각형'][expansion-1]:['선분',values.sweep===1?'정사각형':'직사각형',values.sweep===1?'정육면체':'직육면체'][expansion-1]);

function renderClock(){const now=Date.now();$('activeClock').textContent=clockText(visibleTotal+(visibleSince===null?0:now-visibleSince));$('elapsedClock').textContent=clockText(clockStart===null?0:now-clockStart);$('awayCount').textContent=String(awayCount)}
function clockVisibility(){if(clockStart===null)return;const now=Date.now();if(document.hidden){if(visibleSince!==null){visibleTotal+=Math.max(0,now-visibleSince);visibleSince=null;awayCount++;stop()}$('clockStatus').textContent='화면 이탈 · 시간 일시 정지';$('clockStatus').classList.add('away')}else{if(visibleSince===null)visibleSince=now;$('clockStatus').textContent=awayCount?'활동 화면 복귀':'활동 화면 표시 중';$('clockStatus').classList.remove('away')}renderClock()}
$('studentName').addEventListener('input',()=>{$('studentName').setCustomValidity('')});
$('clockEntry').addEventListener('submit',event=>{event.preventDefault();if(clockStart!==null)return;const name=$('studentName').value.trim();if(!name){$('studentName').setCustomValidity('이름을 입력해 주세요.');$('studentName').reportValidity();return}clockStart=Date.now();visibleSince=document.hidden?null:clockStart;$('clockStudent').textContent=name+' 학생';$('clockStudent').classList.remove('hidden');$('clockEntry').classList.add('hidden');$('clockStatus').textContent='활동 화면 표시 중';renderClock()});
document.addEventListener('visibilitychange',clockVisibility);window.addEventListener('pagehide',()=>{if(visibleSince!==null){visibleTotal+=Math.max(0,Date.now()-visibleSince);visibleSince=null}});window.addEventListener('pageshow',clockVisibility);renderClock();setInterval(renderClock,250);new ResizeObserver(resize).observe($('canvases'));

if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'select_flatland_experiment',description:'활동지에 연결된 실험을 선택합니다.',inputSchema:{type:'object',properties:{step:{type:'integer',minimum:1,maximum:6}},required:['step'],additionalProperties:false},annotations:{readOnlyHint:false},execute(input){if(!Number.isInteger(input.step)||input.step<1||input.step>6)throw Error('1~6 실험을 선택하세요.');go(stageSequence[input.step-1]);return{step:input.step,title:lessons[stage].title}}})).catch(()=>{})}catch(e){}}
go(0);
</script></body></html>
